name: Publish NuGet
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pack:
    if: '!github.event.release.prerelease'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Require a successful Check for this exact revision on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          result=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/check.yml/runs" \
            -f branch="$DEFAULT_BRANCH" -f head_sha="$(git rev-parse HEAD)" -f event=push -f status=success --jq '.total_count')
          if [ "$result" -eq 0 ]; then
            echo "::error::Wait for Check on the release commit to pass on $DEFAULT_BRANCH."
            exit 1
          fi
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Pack and inspect the release candidate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: ./tools/ci/pack-release.ps1 -Tag $env:RELEASE_TAG
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-release
          path: artifacts/release/*nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-release
          path: packages
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish the verified package and adjacent symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push packages/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"

name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Check committed output, or generate files for review
        type: choice
        options: [check, generate]
        default: check

permissions:
  contents: read

jobs:
  catalog:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Read the upstream pin and compatibility baseline
        id: pin
        shell: pwsh
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          $pin = Get-Content catalog/upstream.json -Raw | ConvertFrom-Json
          "commit=$($pin.commit)" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force artifacts | Out-Null
          if ($env:BASE_REF -and $env:BASE_REF -notmatch '^0+$') {
            git cat-file -e "$($env:BASE_REF):catalog/ids.props" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git diff --exit-code $env:BASE_REF HEAD -- catalog/enum-baseline.json tests/KubaiIcons.Tests/Contracts/first-release.json
              if ($LASTEXITCODE) { throw 'The first-release identity baselines are immutable.' }
              $text = git show "$($env:BASE_REF):catalog/ids.props"
              if ($LASTEXITCODE) { throw 'Could not read the base ID ledger.' }
              [IO.File]::WriteAllText((Join-Path $PWD 'artifacts/base-ids.props'), ($text -join "`n") + "`n")
            }
          }
          exit 0
      - uses: actions/checkout@v4
        with:
          repository: kubai087/kubai-icons
          ref: ${{ steps.pin.outputs.commit }}
          path: artifacts/upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /icons-duotone/
            /LICENSE-ICONS
            /icons/
            /badges/
            /package.json
            /packages/core/src/
            /packages/core/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Layered compiler boundaries
        run: node --test tools/validation/scene-compiler.test.mjs
      - name: Fetch matching npm manifests
        run: node tools/ci/upstream.mjs fetch
      - name: Verify artwork, Studio metadata and independent upstream contracts
        shell: pwsh
        env:
          IMPORT_MODE: ${{ inputs.mode || 'check' }}
        run: |
          $options = @{ Mode = $env:IMPORT_MODE }
          if (Test-Path artifacts/base-ids.props) { $options.Baseline = 'artifacts/base-ids.props' }
          ./tools/ci/import.ps1 @options
      - name: Render the published Layered inventory for visual comparison
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browser = Join-Path ${env:ProgramFiles(x86)} 'Microsoft/Edge/Application/msedge.exe'
          node tools/validation/layered-reference.mjs artifacts/upstream artifacts/studio-metadata/layered-icons.json artifacts/layered-validation $browser
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "KUBAI_REFERENCE_DIR=$((Resolve-Path artifacts/layered-validation).Path)" >> $env:GITHUB_ENV
      - name: Select artwork for PR review
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        id: review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: pwsh
        run: |
          git diff --quiet $env:BASE_SHA HEAD -- catalog/upstream.json
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          python tools/ci/sync-review.py $env:BASE_SHA
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "KUBAI_DUOTONE_SHEETS=$((Resolve-Path artifacts/review).Path)" >> $env:GITHUB_ENV
          "enabled=true" >> $env:GITHUB_OUTPUT
      - run: dotnet test KubaiIcons.Avalonia.slnx -c Release
      - name: Pair changed upstream and native artwork
        if: always() && steps.review.outputs.enabled == 'true'
        run: node tools/validation/review-gallery.mjs
      - name: Attach visual review
        if: always() && steps.review.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-artwork-comparison
          path: artifacts/review/gallery/
          if-no-files-found: error
      - run: dotnet pack src/KubaiIcons.Avalonia -c Release --no-restore -o artifacts/package
      - name: Upload generated files for review
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'generate'
        uses: actions/upload-artifact@v4
        with:
          name: generated-catalog-${{ runner.os }}
          path: |
            catalog/ids.props
            catalog/layered-bases.json
            catalog/layered-compositions.json
            catalog/layered-labels.json
            src/KubaiIcons.Avalonia/CatalogData.g.cs
            src/KubaiIcons.Avalonia/Art/Duotone/
            src/KubaiIcons.Avalonia/Art/Scenes/
            src/KubaiIcons.Avalonia/Art/Badges/
            src/KubaiIcons.Avalonia/Rendering/CompositionData.g.cs
            licenses/LICENSE-ICONS
            samples/IconStudio/Catalog/catalog.json
            tests/KubaiIcons.Tests/Contracts/published-inventory.json
            tests/KubaiIcons.Tests/Contracts/duotone-motion.json

name: Check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select checks
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base="$BASE"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A Studio-only commit must not turn a previously failed library check green.
            base=$(gh run list --workflow check.yml --branch "$GITHUB_REF_NAME" --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          fi
          core=false
          catalog=false
          if [[ -z "$base" ]] || ! git merge-base --is-ancestor "$base" HEAD; then
            base="$BASE"
            core=true
            catalog=true
          else
            changed=$(git diff --no-renames --name-only "$base" HEAD)
            while IFS= read -r file; do
              case "$file" in
                catalog/*|tools/KubaiIcons.Importer/*|tools/ci/import.ps1|tools/ci/upstream.mjs|tools/validation/scene-compiler.test.mjs|tools/validation/upstream-contracts.mjs|\
                src/*/Art/*|src/*/*.g.cs|src/*/Rendering/DuotoneData.cs|src/*/Rendering/ArtReader.cs|src/*/Rendering/*Path.cs|\
                samples/IconStudio/Catalog/catalog.json|tests/*/Contracts/duotone-motion.json|tests/*/Contracts/published-inventory.json|tests/*/Contracts/first-release.json|licenses/LICENSE-ICONS|\
                .gitattributes|Directory.Build.*|global.json|.github/workflows/check.yml) catalog=true ;;
                src/*|tests/*|LICENSE|docs/nuget.md) core=true ;;
              esac
            done <<< "$changed"
          fi
          if [[ "$catalog" == true ]]; then
            core=true
            echo "commit=$(jq -r .commit catalog/upstream.json)" >> "$GITHUB_OUTPUT"
            mkdir -p artifacts
            if [[ -n "$base" ]] && git cat-file -e "$base:catalog/ids.props" 2>/dev/null; then
              git diff --exit-code "$base" HEAD -- catalog/enum-baseline.json tests/KubaiIcons.Tests/Contracts/first-release.json
              git show "$base:catalog/ids.props" > artifacts/base-ids.props
            fi
          fi
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "catalog=$catalog" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        if: steps.scope.outputs.core == 'true'
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/checkout@v7
        if: steps.scope.outputs.catalog == 'true'
        with:
          repository: kubai087/kubai-icons
          ref: ${{ steps.scope.outputs.commit }}
          path: artifacts/upstream
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /icons-duotone/
            /LICENSE-ICONS
            /icons/
            /badges/
            /package.json
            /packages/core/src/
            /packages/core/package.json
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.catalog == 'true'
        with:
          node-version: 24
      - name: Verify the pinned catalog and generated resources
        if: steps.scope.outputs.catalog == 'true'
        run: |
          node --test tools/validation/scene-compiler.test.mjs
          node tools/ci/upstream.mjs fetch
          baseline=()
          if [[ -f artifacts/base-ids.props ]]; then baseline=(-Baseline artifacts/base-ids.props); fi
          pwsh -File tools/ci/import.ps1 check "${baseline[@]}"
      - name: Test and pack the library
        if: steps.scope.outputs.core == 'true'
        run: |
          dotnet test tests/KubaiIcons.Tests -c Release --filter 'TestCategory!=Artwork'
          dotnet pack src/KubaiIcons.Avalonia -c Release --no-restore -o artifacts/package
